<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration | HiTek Informatique</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5fa;
      color: #241b2f;
    }

    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .admin-header {
      margin-bottom: 30px;
    }

    .admin-header h1 {
      margin-bottom: 8px;
    }

    .admin-card {
      background: white;
      border: 1px solid #eeeaf5;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .admin-form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #dcd6e5;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .admin-button {
      border: 0;
      border-radius: 8px;
      padding: 13px 20px;
      background: #6d28d9;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .admin-form {
        grid-template-columns: 1fr;
      }

      .field-full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<div id="login-section">
  <h1>Administration HiTek</h1>
  <p>Connectez-vous pour gérer votre catalogue.</p>

  <form id="login-form">
    <label for="admin-email">Courriel</label>
    <input type="email" id="admin-email" placeholder="Courriel" required>

    <label for="admin-password">Mot de passe</label>
    <input type="password" id="admin-password" placeholder="Mot de passe" required>

    <button type="submit">Se connecter</button>

    <p id="login-message"></p>
  </form>
</div>
  <main class="admin-container">

    <main class="admin-container" id="admin-section" style="display:none;">
      <h1>HiTek — Administration</h1>
      <p>Gestion du catalogue des appareils et accessoires.</p>
    </div>

    <section class="admin-card">

      <h2>Ajouter un produit</h2>

      <form class="admin-form" id="product-form">

        <div class="field">
          <label for="product-name">Nom du produit</label>
          <input id="product-name" type="text" required>
        </div>

        <div class="field">
          <label for="product-category">Catégorie</label>

          <select id="product-category" required>
            <option value="macbook">MacBook</option>
            <option value="pc">PC portables</option>
            <option value="mobile">Smartphones & tablettes</option>
            <option value="accessoires">Accessoires</option>
          </select>
        </div>

        <div class="field">
          <label for="product-price">Prix ($)</label>
         <input id="product-price" type="number" min="0" step="0.01" placeholder="Optionnel">
        </div>

        <div class="field">
          <label for="product-quantity">Quantité</label>
          <input id="product-quantity" type="number" min="0" value="1" required>
        </div>

        <div class="field field-full">
          <label for="product-description">Description</label>
          <textarea id="product-description"></textarea>
        </div>

        <div class="field field-full">
          <label for="product-image">Photo du produit</label>
          <input id="product-image" type="file" accept="image/*">
        </div>

        <div class="field-full">
          <button class="admin-button" type="submit">
            Ajouter le produit
          </button>
        </div>

      </form>

    </section>

    <section class="admin-card">
      <h2>Produits du catalogue</h2>
      <div id="product-list">
        Aucun produit chargé.
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const SUPABASE_URL = "https://pfoeasugxfdjveityhfn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_dAVEh7oP_ZZYklySHh2fhQ_n8ZzTko1";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
    const loginForm = document.getElementById("login-form");
const loginMessage = document.getElementById("login-message");

loginForm.addEventListener("submit", async function (event) {
  event.preventDefault();

  const email = document.getElementById("admin-email").value;
  const password = document.getElementById("admin-password").value;

  loginMessage.textContent = "Connexion...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

 if (error) {
  loginMessage.textContent = "Courriel ou mot de passe incorrect.";
  return;
}

document.getElementById("login-section").style.display = "none";
document.getElementById("admin-section").style.display = "block";
});

    const productForm = document.getElementById("product-form");

productForm.addEventListener("submit", async function (event) {
  event.preventDefault();

  const name = document.getElementById("product-name").value.trim();
  const category = document.getElementById("product-category").value;
  const description = document.getElementById("product-description").value.trim();
  const quantity = Number(document.getElementById("product-quantity").value);
  const imageFile = document.getElementById("product-image").files[0];

  const priceValue = document.getElementById("product-price").value;
  const price = priceValue === "" ? null : Number(priceValue);
let imageUrl = null;

if (imageFile) {
  const fileExtension = imageFile.name.split(".").pop();
  const fileName = `${Date.now()}-${crypto.randomUUID()}.${fileExtension}`;

  const { error: uploadError } = await supabaseClient.storage
    .from("product-images")
    .upload(fileName, imageFile);

  if (uploadError) {
    console.error("Erreur upload photo :", uploadError);
    alert("Erreur lors de l'envoi de la photo.");
    return;
  }

  const { data: publicUrlData } = supabaseClient.storage
    .from("product-images")
    .getPublicUrl(fileName);

  imageUrl = publicUrlData.publicUrl;
}
  const { data, error } = await supabaseClient
    .from("products")
    .insert({
      name: name,
      category: category,
      description: description,
      price: price,
      quantity: quantity,
      image_url: imageUrl,
      published: true
    })
    .select();

  if (error) {
    console.error("Erreur ajout produit :", error);
    alert("Erreur lors de l'ajout du produit.");
    return;
  }

  alert("Produit ajouté avec succès !");
  console.log("Produit ajouté :", data);

  productForm.reset();
  document.getElementById("product-quantity").value = "1";
});
    async function loadProducts() {
  const productList = document.getElementById("product-list");

  const { data: products, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Erreur chargement produits :", error);
    productList.innerHTML = "<p>Impossible de charger les produits.</p>";
    return;
  }

  if (!products || products.length === 0) {
    productList.innerHTML = "<p>Aucun produit dans le catalogue.</p>";
    return;
  }

  productList.innerHTML = "";

  products.forEach(product => {
    const item = document.createElement("div");

    item.innerHTML = `
      ${product.image_url
        ? `<img src="${product.image_url}" alt="${product.name}" style="width:100px;height:100px;object-fit:contain;">`
        : "<p>Pas de photo</p>"
      }

      <strong>${product.name}</strong>
      <p>Catégorie : ${product.category}</p>
      <p>Quantité : ${product.quantity}</p>
    `;

    productList.appendChild(item);
  });
}
</script>
</body>
</html>
